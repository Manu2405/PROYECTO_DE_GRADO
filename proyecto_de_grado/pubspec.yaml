name: proyecto_de_grado
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  animate_do: ^5.1.0
  font_awesome_flutter: ^11.0.0
  
  # Utilidades
  connectivity_plus: ^6.1.3  # Para verificar conexión a internet (versión más actual y estable)
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icono.png"