name: proyecto_de_grado
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  animate_do: ^5.1.0
  font_awesome_flutter: ^11.0.0

  # PDF
  pdf: ^3.12.0
  printing: ^5.14.3
  path_provider: ^2.1.3
  open_file: ^3.3.2
  permission_handler: ^11.3.1
  share_plus: ^10.1.2
  
  # Utilidades
  connectivity_plus: ^6.0.0
  flutter_launcher_icons: ^0.14.4

   # Gráficos
  fl_chart: ^1.2.0

  image_picker: ^1.2.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icono.png"