<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="proyecto_de_grado">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  
  <title>VitaSenior</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    /* Estilos para la cámara */
    #camera-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #camera-video {
      width: 80%;
      max-width: 640px;
      border-radius: 10px;
      transform: scaleX(-1);
    }
    #camera-buttons {
      margin-top: 20px;
    }
    .camera-btn {
      padding: 10px 20px;
      margin: 0 10px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .camera-btn-capture {
      background: #0EA5E9;
      color: white;
    }
    .camera-btn-close {
      background: #EF4444;
      color: white;
    }
  </style>
  
  <script>
    let mediaStream = null;
    let videoElement = null;
    
    // Función para abrir la cámara en PC
    window.openCameraPC = function() {
      return new Promise(async (resolve, reject) => {
        try {
          // Solicitar acceso a la cámara
          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          mediaStream = stream;
          
          // Crear contenedor
          const container = document.createElement('div');
          container.id = 'camera-container';
          
          // Crear video
          videoElement = document.createElement('video');
          videoElement.id = 'camera-video';
          videoElement.srcObject = stream;
          videoElement.autoplay = true;
          videoElement.playsInline = true;
          
          // Crear botones
          const buttonsDiv = document.createElement('div');
          buttonsDiv.id = 'camera-buttons';
          
          const captureBtn = document.createElement('button');
          captureBtn.textContent = '📸 Tomar Foto';
          captureBtn.className = 'camera-btn camera-btn-capture';
          captureBtn.onclick = () => {
            // Capturar foto
            const canvas = document.createElement('canvas');
            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            
            // Cerrar cámara
            if (mediaStream) {
              mediaStream.getTracks().forEach(track => track.stop());
            }
            container.remove();
            resolve(dataUrl);
          };
          
          const closeBtn = document.createElement('button');
          closeBtn.textContent = '❌ Cerrar';
          closeBtn.className = 'camera-btn camera-btn-close';
          closeBtn.onclick = () => {
            if (mediaStream) {
              mediaStream.getTracks().forEach(track => track.stop());
            }
            container.remove();
            resolve(null);
          };
          
          buttonsDiv.appendChild(captureBtn);
          buttonsDiv.appendChild(closeBtn);
          container.appendChild(videoElement);
          container.appendChild(buttonsDiv);
          document.body.appendChild(container);
          
          // Reproducir video
          await videoElement.play();
          
        } catch (error) {
          console.error('Error al acceder a la cámara:', error);
          reject('No se pudo acceder a la cámara. Verifica los permisos.');
        }
      });
    };
    
    // Función para seleccionar de galería
    window.selectFromGallery = function() {
      return new Promise((resolve, reject) => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        
        input.onchange = (event) => {
          const file = event.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
              resolve(e.target.result);
            };
            reader.onerror = (e) => {
              reject('Error al leer la imagen');
            };
            reader.readAsDataURL(file);
          } else {
            resolve(null);
          }
        };
        
        input.click();
      });
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
